[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "twostage-be"
version = "0.1.0"
description = "Two-stage bioequivalence designs: Karalis TSD-1/2 and Potvin B/C/D"
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{name = "Vangelis D. Karalis"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["Bioequivalence", "Two-stage designs"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.urls]
Repository = "https://github.com/vkaralis/be-tsd"
Documentation = "https://github.com/vkaralis/be-tsd/blob/main/README.md"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "cffconvert>=2"]
plots = ["matplotlib>=3.7"]

[project.scripts]
twostage-be = "twostage_be.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
